name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: capital_test
          POSTGRES_PASSWORD: capital_test
          POSTGRES_DB: tommma_capital_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U capital_test -d tommma_capital_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://capital_test:capital_test@127.0.0.1:5432/tommma_capital_test?schema=public
      CAPITAL_TEST_DATABASE_URL: postgresql://capital_test:capital_test@127.0.0.1:5432/tommma_capital_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: corepack enable
      - run: npm ci
      - run: pnpm -C frontend install --frozen-lockfile
      - run: npm --prefix backend ci
      - run: npm run check:fast
      - run: npm --prefix backend run prisma:deploy
      - run: npm --prefix backend run test:capital -- --maxWorkers=2
      - run: pnpm -C frontend exec vitest run --config vitest.capital.config.ts
